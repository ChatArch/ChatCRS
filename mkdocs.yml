site_name: ChatCRS 文档
site_description: Safe CRS remote operations, admin inspection, and lifecycle management
site_url: https://arch.gh.wzhecnu.cn/ChatCRS/
repo_url: https://github.com/ChatArch/ChatCRS
repo_name: ChatArch/ChatCRS

nav:
  - 首页: index.md
  - CLI 命令树: cli.md
  - 配置与目标: configuration.md
  - 生产维护: production-maintenance.md
  - 开发与发布: development.md

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    primary: blue grey
    accent: orange

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
          site_name: ChatCRS 文档
        - locale: en
          name: English
          build: true
          site_name: ChatCRS Documentation
          nav_translations:
            首页: Home
            CLI 命令树: CLI Tree
            配置与目标: Configuration and Targets
            生产维护: Production Maintenance
            开发与发布: Development and Release

extra:
  alternate:
    - name: 中文
      link: /ChatCRS/
      lang: zh
    - name: English
      link: /ChatCRS/en/
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

strict: true
