site_name: ChatCRS 文档
site_description: HTTP/API-first CRS management helpers for ChatArch
site_url: https://arch.gh.wzhecnu.cn/ChatCRS/
repo_url: https://github.com/ChatArch/ChatCRS
repo_name: ChatArch/ChatCRS

nav:
  - 首页: index.md
  - 管理面:
      - 命令树: cli.md
      - 接口映射: interfaces.md
  - 配置: configuration.md
  - 运维:
      - 生产维护: production-maintenance.md
  - 开发:
      - 开发与发布: development.md

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    primary: blue grey
    accent: orange

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
          site_name: ChatCRS 文档
        - locale: en
          name: English
          build: true
          site_name: ChatCRS Documentation
          nav_translations:
            首页: Home
            管理面: Management
            命令树: CLI Tree
            接口映射: Interface Map
            配置: Configuration
            运维: Operations
            生产维护: Production Maintenance
            开发: Development
            开发与发布: Development and Release

extra:
  alternate:
    - name: 中文
      link: /ChatCRS/
      lang: zh
    - name: English
      link: /ChatCRS/en/
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

strict: true
